schema: spec-driven

# Project context, shown when creating artifacts.
context: |
  Custom OpenWrt build for the NanoPi R4S 4GB: the specs in openspec/specs, the
  changes that built it in openspec/changes/archive.
  Every artifact, document, comment and identifier is written in English:
  concise, modern technical prose with consistent terminology across changes.
  Requirement and scenario names are referenced by @spec markers in tests/, so
  renaming one means updating those markers.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
