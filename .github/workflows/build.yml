# Build the R4S firmware in two stages that each fit in the 6-hour job limit, then
# test the result in the emulator (design D11):
#   host-toolchain: tools + cross toolchain, cached by the inputs that affect them
#   firmware:       everything else (ci profile: all kmods), unsigned artifacts
#   system-test:    the system tests against the shipped image, JUnit report
# No job here uses any secret; signing happens elsewhere (r4s-release-pipeline).
name: build

on:
  push:
    branches: [main]
    paths-ignore: ["openspec/**", "docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["openspec/**", "docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # bash -eo pipefail: a failing command inside a pipe (e.g. | tee) fails the step.
    shell: bash

env:
  WRT_WORKDIR: /mnt/wrt
  NIX_CONFIG: experimental-features = nix-command flakes

jobs:
  host-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7

      - name: Prepare runner
        # Before Nix is installed, so the script runs directly rather than via just.
        run: scripts/runner-prepare.sh

      - uses: DeterminateSystems/nix-installer-action@v23

      - name: Host environment
        run: |
          nix develop -c just env-report | tee env-report.txt
          { echo '### Host environment'; echo '```'; cat env-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch and patch sources
        run: nix develop -c sh -c 'just fetch && just patch'

      - name: Toolchain cache key
        id: key
        run: nix develop -c just toolchain-key >> "$GITHUB_OUTPUT"

      - name: Restore toolchain
        id: cache
        uses: actions/cache/restore@v6
        with:
          key: ${{ steps.key.outputs.key }}
          path: ${{ env.WRT_WORKDIR }}/toolchain-cache.tar.zst

      - name: Build tools and toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          nix develop -c sh -c 'just config ci && just toolchain-build'
          nix develop -c just toolchain-pack "$WRT_WORKDIR/toolchain-cache.tar.zst"

      - name: Save toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.key.outputs.key }}
          path: ${{ env.WRT_WORKDIR }}/toolchain-cache.tar.zst

  firmware:
    needs: host-toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7

      - name: Prepare runner
        # Before Nix is installed, so the script runs directly rather than via just.
        run: scripts/runner-prepare.sh

      - uses: DeterminateSystems/nix-installer-action@v23

      - name: Fetch, patch and configure
        run: nix develop -c sh -c 'just fetch && just patch && just config ci'

      - name: Restore toolchain
        uses: actions/cache/restore@v6
        with:
          key: ${{ needs.host-toolchain.outputs.key }}
          path: ${{ env.WRT_WORKDIR }}/toolchain-cache.tar.zst
          fail-on-cache-miss: true

      - name: Unpack toolchain
        run: nix develop -c just toolchain-unpack "$WRT_WORKDIR/toolchain-cache.tar.zst"

      - name: Restore download cache
        uses: actions/cache/restore@v6
        with:
          key: dl-${{ hashFiles('upstream.lock', 'feed/**/Makefile') }}
          restore-keys: dl-
          path: ${{ env.WRT_WORKDIR }}/dl

      # v2: entries hashed by the compiler's content (config/ccache.conf); entries
      # of the unversioned caches were hashed by its mtime and can never hit.
      - name: Restore compiler cache
        uses: actions/cache/restore@v6
        with:
          key: ccache-v2-${{ github.run_id }}
          restore-keys: ccache-v2-
          path: ${{ env.WRT_WORKDIR }}/ccache

      - name: Build firmware
        run: nix develop -c scripts/build.sh ci

      - name: Save download cache
        if: always()
        uses: actions/cache/save@v6
        with:
          key: dl-${{ hashFiles('upstream.lock', 'feed/**/Makefile') }}
          path: ${{ env.WRT_WORKDIR }}/dl

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v6
        with:
          key: ccache-v2-${{ github.run_id }}
          path: ${{ env.WRT_WORKDIR }}/ccache

      - name: Build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs
          path: ${{ env.WRT_WORKDIR }}/openwrt/logs
          if-no-files-found: ignore

      - name: Upload unsigned firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-unsigned
          path: ${{ env.WRT_WORKDIR }}/out/ci
          if-no-files-found: error

  system-test:
    needs: firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Prepare runner
        # Before Nix is installed, so the script runs directly rather than via just.
        run: scripts/runner-prepare.sh

      - uses: DeterminateSystems/nix-installer-action@v23

      - uses: actions/download-artifact@v8
        with:
          name: firmware-unsigned
          path: ${{ env.WRT_WORKDIR }}/out/ci

      - name: System tests
        run: nix develop -c just test ci -rs

      - name: Spec coverage
        run: nix develop -c sh -c 'cd tests && uv run --locked spec-coverage --change r4s-build-foundation'

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: system-test-report
          path: tests/.reports
          include-hidden-files: true
          if-no-files-found: error
