# Build the firmware of every board (boards/) in two stages that each fit in the
# 6-hour job limit, test each board's image in the emulator (design D11), then
# sign and release them together (r4s-release-pipeline D2, D3, D5; board-model D9):
#   host-toolchain: tools + the board-neutral cross toolchain, cached by the inputs
#                   that affect them; the list of boards
#   firmware:       per board, everything else (ci profile: all kmods), unsigned
#   caches:         of this ref's caches, only the current and newest stay
#   system-test:    per board, the system tests against the shipped image, JUnit
#                   reports, in parallel emulators (the drill among them, with
#                   test keys)
#   sign:           the pinned signing tools on every board's unsigned artifacts;
#                   the keys exist only in the release-signing environment, whose
#                   reviewers approve every run
#   drill:          per board, the latest stable release upgraded to the signed
#                   candidate in the emulator, with the production trust anchors
#   upgrade-drill:  the check main's rules require: the system tests passed, and
#                   every drill passed or signing did not run
#   publish:        one release of every board: a candidate (pre-release) from a
#                   bump branch, stable from main
# Signing and what follows run on main and bump/* once the release keys are in
# place (repository variable RELEASE_SIGNING = enabled). Only sign has a secret.
name: build

on:
  push:
    branches: [main]
    paths-ignore: ["openspec/**", "docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["openspec/**", "docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # bash -eo pipefail: a failing command inside a pipe (e.g. | tee) fails the step.
    shell: bash

env:
  WRT_WORKDIR: /mnt/wrt
  NIX_CONFIG: experimental-features = nix-command flakes

jobs:
  host-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    outputs:
      key: ${{ steps.key.outputs.key }}
      boards: ${{ steps.boards.outputs.boards }}
    steps:
      - uses: actions/checkout@v7

      - name: Prepare runner
        # Before Nix is installed, so the script runs directly rather than via just.
        run: scripts/runner-prepare.sh

      - uses: DeterminateSystems/nix-installer-action@v23

      - name: Boards
        id: boards
        run: |
          boards=$(nix develop .#build -c just boards)
          echo "boards=${boards}" >> "$GITHUB_OUTPUT"

      - name: Fetch and patch sources
        run: nix develop .#build -c just fetch patch

      - name: Toolchain cache key
        id: key
        run: nix develop .#build -c just toolchain-key ci >> "$GITHUB_OUTPUT"

      - name: Restore toolchain
        id: cache
        uses: actions/cache/restore@v6
        with:
          key: ${{ steps.key.outputs.key }}
          path: ${{ env.WRT_WORKDIR }}/toolchain-cache.tar.zst

      - name: Build tools and toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          nix develop .#build -c just toolchain-build ci
          nix develop .#build -c just toolchain-pack "$WRT_WORKDIR/toolchain-cache.tar.zst"

      - name: Save toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.key.outputs.key }}
          path: ${{ env.WRT_WORKDIR }}/toolchain-cache.tar.zst

  firmware:
    needs: host-toolchain
    name: firmware (${{ matrix.board }})
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.host-toolchain.outputs.boards) }}
    env:
      BOARD: ${{ matrix.board }}
    steps:
      - uses: actions/checkout@v7

      - name: Prepare runner
        # Before Nix is installed, so the script runs directly rather than via just.
        run: scripts/runner-prepare.sh

      - uses: DeterminateSystems/nix-installer-action@v23

      - name: Fetch, patch and configure
        run: nix develop .#build -c just fetch patch config "$BOARD" ci

      - name: Restore download cache
        uses: actions/cache/restore@v6
        with:
          key: dl-${{ hashFiles('upstream.lock', 'feed/**/Makefile') }}
          restore-keys: dl-
          path: ${{ env.WRT_WORKDIR }}/dl

      # Keyed by the board, whose packages no other board's build compiles alike,
      # by config/ccache.conf, which decides whether an entry can hit (it
      # identifies the compiler by its content), then by run.
      - name: Restore compiler cache
        uses: actions/cache/restore@v6
        with:
          key: ccache-${{ matrix.board }}-${{ hashFiles('config/ccache.conf') }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.board }}-${{ hashFiles('config/ccache.conf') }}-
          path: ${{ env.WRT_WORKDIR }}/ccache

      # Restored last, so that the toolchain is the most recently used of the
      # caches this job restores: past the quota GitHub evicts the least recently
      # used, which is then a download or compiler cache this run supersedes, not
      # the toolchain that a re-run of this job needs.
      - name: Restore toolchain
        uses: actions/cache/restore@v6
        with:
          key: ${{ needs.host-toolchain.outputs.key }}
          path: ${{ env.WRT_WORKDIR }}/toolchain-cache.tar.zst
          fail-on-cache-miss: true

      - name: Unpack toolchain
        run: nix develop .#build -c just toolchain-unpack "$WRT_WORKDIR/toolchain-cache.tar.zst"

      - name: Build firmware
        env:
          # The board's own cache: it keeps what this build used (scripts/build.sh).
          WRT_CCACHE_TRIM: 1
        run: nix develop .#build -c scripts/build.sh "$BOARD" ci

      - name: Save download cache
        if: always()
        uses: actions/cache/save@v6
        with:
          key: dl-${{ hashFiles('upstream.lock', 'feed/**/Makefile') }}
          path: ${{ env.WRT_WORKDIR }}/dl

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v6
        with:
          key: ccache-${{ matrix.board }}-${{ hashFiles('config/ccache.conf') }}-${{ github.run_id }}
          path: ${{ env.WRT_WORKDIR }}/ccache

      - name: Build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.board }}
          path: ${{ env.WRT_WORKDIR }}/openwrt/logs
          if-no-files-found: ignore

      - name: Upload unsigned firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-unsigned-${{ matrix.board }}
          path: ${{ env.WRT_WORKDIR }}/out/${{ matrix.board }}/ci
          if-no-files-found: error

  # Every run saves a compiler cache per board, holding what its build used, and,
  # whenever their inputs change, a download cache and a toolchain. Past the 10 GB
  # quota GitHub evicts the least recently used caches, so the firmware jobs
  # restore the toolchain last. The run then keeps, of its own ref's caches, the
  # current toolchain and the newest download cache and compiler cache of each board.
  caches:
    needs: [host-toolchain, firmware]
    if: always() && github.event_name != 'pull_request' && needs.host-toolchain.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Prune superseded caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TOOLCHAIN: ${{ needs.host-toolchain.outputs.key }}
        run: |
          gh cache list --ref "$GITHUB_REF" --limit 100 --sort created_at --order desc \
            --json key --jq '.[].key' >caches
          awk -v toolchain="$TOOLCHAIN" '
            /^toolchain-/ { if ($0 != toolchain) print; next }
            /^dl-/ { if (kept["dl"]++) print; next }
            /^ccache-/ { split($0, part, "-"); if (kept[part[2]]++) print; next }
          ' caches >superseded
          # A cache GitHub evicted meanwhile is gone either way.
          while read -r key; do
            gh cache delete "$key" || echo "::warning::cache $key was not deleted"
          done <superseded

  system-test:
    needs: [host-toolchain, firmware]
    name: system-test (${{ matrix.board }}, ${{ matrix.suite.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.host-toolchain.outputs.boards) }}
        suite:
          - name: system
            paths: build firmware quality testing unit
          - name: network
            paths: network
          - name: services
            paths: storage services
          - name: release
            paths: release ops
    env:
      BOARD: ${{ matrix.board }}
    steps:
      - uses: actions/checkout@v7

      - name: Prepare runner
        # Before Nix is installed, so the script runs directly rather than via just.
        run: scripts/runner-prepare.sh

      - uses: DeterminateSystems/nix-installer-action@v23

      - uses: actions/download-artifact@v8
        with:
          name: firmware-unsigned-${{ matrix.board }}
          path: ${{ env.WRT_WORKDIR }}/out/${{ matrix.board }}/ci

      - name: Host environment
        run: |
          nix develop -c just env-report | tee env-report.txt
          { echo '### Host environment'; echo '```'; cat env-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: System tests
        run: nix develop -c just test "$BOARD" ci ${{ matrix.suite.paths }} -rs

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: system-test-report-${{ matrix.board }}-${{ matrix.suite.name }}
          path: tests/.reports
          include-hidden-files: true
          if-no-files-found: error

      # The router's serial console over the whole run: what it did while a
      # failing test waited, which the report cannot show.
      - name: Console log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: system-test-console-${{ matrix.board }}-${{ matrix.suite.name }}
          path: ${{ env.WRT_WORKDIR }}/test/${{ matrix.board }}/emulator*/console.log
          if-no-files-found: ignore

  # The keys exist only in the release-signing environment, whose reviewers
  # approve every run; this job runs nothing but the pinned signing tools on
  # what the firmware jobs built, every board's build in one approval. Main and
  # the weekly bump branches only, never a pull request, once the release keys
  # are in place.
  sign:
    needs: system-test
    if: >-
      vars.RELEASE_SIGNING == 'enabled' && github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/bump/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release-signing
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23

      - uses: actions/download-artifact@v8
        with:
          pattern: firmware-unsigned-*
          path: ${{ runner.temp }}/unsigned

      - name: Sign
        env:
          APK_KEY: ${{ secrets.RELEASE_APK_KEY }}
          FW_KEY: ${{ secrets.RELEASE_FW_KEY }}
        run: |
          umask 077
          printf '%s\n' "$APK_KEY" >"$RUNNER_TEMP/apk.key"
          printf '%s\n' "$FW_KEY" >"$RUNNER_TEMP/fw.key"
          for build in "$RUNNER_TEMP"/unsigned/*/; do
            board=$(jq -r .board "$build/manifest.json")
            nix run .#sign-tools -- scripts/release-sign.sh "$build" "$RUNNER_TEMP/signed/$board" \
              --apk-key "$RUNNER_TEMP/apk.key" --fw-key "$RUNNER_TEMP/fw.key"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-signed
          path: ${{ runner.temp }}/signed
          if-no-files-found: error

  # Per board, the latest stable release (or this build, before the first)
  # upgraded to the signed candidate in the emulator, trusting only its own
  # release keys: the drill tests, as system-test runs them with test keys.
  drill:
    needs: [host-toolchain, sign]
    name: drill (${{ matrix.board }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.host-toolchain.outputs.boards) }}
    env:
      BOARD: ${{ matrix.board }}
    steps:
      - uses: actions/checkout@v7

      - name: Prepare runner
        # Before Nix is installed, so the script runs directly rather than via just.
        run: scripts/runner-prepare.sh

      - uses: DeterminateSystems/nix-installer-action@v23

      - uses: actions/download-artifact@v8
        with:
          name: firmware-unsigned-${{ matrix.board }}
          path: ${{ env.WRT_WORKDIR }}/out/${{ matrix.board }}/ci

      - uses: actions/download-artifact@v8
        with:
          name: firmware-signed
          path: ${{ env.WRT_WORKDIR }}/signed

      - name: Drill base
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix develop -c just drill-base "$BOARD"

      - name: Upgrade drill
        env:
          WRT_SIGNED: ${{ env.WRT_WORKDIR }}/signed/${{ matrix.board }}
        run: nix develop -c just test "$BOARD" drill-base -m drill -rs

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drill-report-${{ matrix.board }}
          path: tests/.reports
          include-hidden-files: true
          if-no-files-found: error

      - name: Console log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: drill-console-${{ matrix.board }}
          path: ${{ env.WRT_WORKDIR }}/test/${{ matrix.board }}/emulator*/console.log
          if-no-files-found: ignore

  # The check main's rules require (board-model D9), under the name it always
  # had: a matrix reports each board's drill on its own. It fails unless the
  # system tests passed and every board's drill passed, or signing, and with it
  # every drill, did not run (pull requests, no release keys yet). A failed or
  # rejected signing skips the drills too, and fails here.
  upgrade-drill:
    needs: [system-test, sign, drill]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every board's drill
        env:
          SYSTEM_TEST: ${{ needs.system-test.result }}
          SIGN: ${{ needs.sign.result }}
          DRILL: ${{ needs.drill.result }}
        run: |
          echo "system-test: $SYSTEM_TEST, sign: $SIGN, drill: $DRILL"
          [ "$SYSTEM_TEST" = success ] &&
            { [ "$DRILL" = success ] || { [ "$SIGN" = skipped ] && [ "$DRILL" = skipped ]; }; }

  # One release of every board: a candidate (pre-release) from a bump branch, a
  # stable release from main, never before every board's drill passed.
  publish:
    needs: [drill, upgrade-drill]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23

      - uses: actions/download-artifact@v8
        with:
          name: firmware-signed
          path: ${{ runner.temp }}/signed

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ github.ref != 'refs/heads/main' && '--prerelease' || '' }}
        run: >-
          nix develop .#quality -c scripts/release-publish.sh "$RUNNER_TEMP/signed" "$RUNNER_TEMP/release"
          ${CANDIDATE:+"$CANDIDATE"} --upload
