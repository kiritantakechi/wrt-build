# ccache settings of the build tree. link_tree (scripts/lib/tree.sh) links this file
# into the cache directory ($WRT_WORKDIR/compiler-cache/ccache, which the tree
# links as .ccache, where rules.mk looks), so every ccache call reads it, and a
# cache that CI restores cannot override it. rules.mk sets CCACHE_BASEDIR and
# CCACHE_NOCOMPRESS itself.

# Identify the compiler by its content, not by its mtime (the default): CI unpacks
# the cached toolchain with fresh mtimes (scripts/toolchain-unpack.sh), which the
# default check takes for a new compiler, so every target compilation missed.
compiler_check = content

# Room for about two builds of the ci profile (all kmods), so that a build which
# changes the kernel configuration does not evict the entries of the rest.
max_size = 12G
