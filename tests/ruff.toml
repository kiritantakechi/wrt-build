# ruff configuration of the system tests (design D12): every rule, and each
# exception says why.
line-length = 100
target-version = "py314"

[lint]
select = ["ALL"]
ignore = [
    # The formatter owns trailing commas; the rule conflicts with ruff format.
    "COM812",
    # Files carry no copyright headers; licensing is decided for the repository as a whole.
    "CPY001",
    # Docstring layout: keep D211 (no blank line before a class docstring) and
    # D212 (summary on the first line); their opposites D203 and D213 conflict.
    "D203",
    "D213",
    # The harness drives the pinned tools of wrt-test-fhs from PATH; every
    # argument comes from the test code itself, never from outside input.
    "S603",
    "S607",
]

[lint.per-file-ignores]
# Tests: assert is how pytest checks; each test documents itself through its @spec
# marker (capability, requirement, scenario); pytest imports test modules by path
# (--import-mode=importlib), so test directories are not packages.
"**/test_*.py" = ["S101", "D103", "INP001"]
"*/conftest.py" = ["INP001"]
# Command-line tools print their report.
"wrt_tests/boards.py" = ["T201"]
"wrt_tests/coverage.py" = ["T201"]

[lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
