# The real NanoPi R4S, reached over the LAN. scripts/test-device.sh sets
# $LG_DEVICE_HOST; power is switched by hand whenever a test asks for it.
targets:
  main:
    resources:
      NetworkService:
        address: !template "$LG_DEVICE_HOST"
        username: root
    drivers:
      ManualPowerDriver:
        name: NanoPi R4S
      SSHDriver: {}
