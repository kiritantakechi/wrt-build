# The emulated R4S (design D14, r4s-ab-rollback D7): the emulator's U-Boot boots
# the shipped factory image from an SD card, a copy-on-write overlay of it, and
# hands the R4S-identity device tree on to the kernel. scripts/test.sh fills
# $LG_EMU_DIR with emu-prepare and runs the suite inside the network sandbox,
# where eth0 (WAN) sits on br-wan and eth1 (LAN) on br-lan. The xHCI controller
# takes the USB data disks the tests plug in and out (r4s-services D10).
targets:
  main:
    resources:
      NetworkService:
        address: 10.0.0.1
        username: root
    drivers:
      QEMUDriver:
        qemu_bin: qemu
        machine: virt,gic-version=3
        cpu: cortex-a72
        memory: 4G
        bios: bios
        dtb: dtb
        extra_args: !template >-
          -smp 6
          -drive if=none,id=sd,format=qcow2,file=$LG_EMU_DIR/overlay.qcow2
          -device sdhci-pci
          -device sd-card,id=card,drive=sd
          -netdev tap,id=wan,ifname=emu-wan,script=no,downscript=no
          -device virtio-net-pci,netdev=wan,mac=52:54:00:0a:00:10
          -netdev tap,id=lan,ifname=emu-lan,script=no,downscript=no
          -device virtio-net-pci,netdev=lan,mac=52:54:00:0a:00:11
          -device i6300esb
          -device qemu-xhci,id=xhci
          -action watchdog=reset
      SSHDriver:
        # The first boot of a slot creates dropbear's host keys, which takes a
        # while under TCG, before the first connection is accepted.
        connection_timeout: 120.0
images:
  bios: !template "$LG_EMU_DIR/u-boot.bin"
  dtb: !template "$LG_EMU_DIR/r4s.dtb"
tools:
  qemu: qemu-system-aarch64
