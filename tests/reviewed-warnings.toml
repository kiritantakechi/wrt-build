# UB-indicative warnings reviewed as not undefined behavior (spec
# quality/undefined-behavior). tests/quality/test_undefined_behavior.py checks every
# build's report (warnings.json) against them; docs/undefined-behavior.md says how
# a warning is reviewed. Undefined behavior is never reviewed here: a patch fixes it.
#
# An entry matches a warning on package, option, file and function (empty outside
# any function), never on the line. `boards` limits it to those boards' builds,
# where only they emit the warning. `reviewed` is the date of the review.
#
# [[warning]]
# package = "<source package>"
# option = "-W<option>"
# file = "<file, as the report names it>"
# function = "<function>"
# reason = "<why it is not undefined behavior>"
# reviewed = 2026-10-05

# bash 5.3.20
[[warning]]
package = "bash"
option = "-Wmaybe-uninitialized"
file = "/usr/local/src/chet/src/bash/src/parse.y"
function = "parse_comsub"
reason = "parse_comsub is static and its four callers pass '(' or '{' as open; for '{' it sets dolbrace_spec from FUNSUB_CHAR or returns early, and dolbrace_spec is read only when open is '{'."
reviewed = 2026-10-05

[[warning]]
