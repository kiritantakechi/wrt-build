# Scenarios verified by the build or by CI itself rather than by a system test.
# spec-coverage counts them as covered; a scenario listed here must not also have
# a test. `by` names the job or command whose success is the evidence.

# build/ci: the pipeline verifies itself.

[[scenario]]
capability = "build/ci"
requirement = "Staged build within job time limits"
scenario = "Cold-cache build"
by = "build.yml host-toolchain + firmware on a cold cache: run 37143040755, its host stage 208 min and its firmware jobs 82 and 99 min, from empty caches under new keys (docs/ci.md)"

[[scenario]]
capability = "build/ci"
requirement = "Staged build within job time limits"
scenario = "Toolchain cache hit"
by = "build.yml host-toolchain restores the toolchain cache; firmware builds on it: run 37181836494, its host stage 4 min, and neither firmware job's report holds a toolchain stage, which scripts/build.sh fails on (docs/ci.md)"

[[scenario]]
capability = "build/ci"
requirement = "Cache keyed on actual inputs"
scenario = "Only the packages feed updated"
by = "scripts/toolchain-key.sh hashes tools/, toolchain/, the build files that name the host stamps (include/depends.mk, include/host-build.mk, rules.mk), lang/golang, lang/rust, the board-neutral configuration composed from the profile's seeds, WRT_BUILD_INPUTS, and the two scripts that build and pack the archive with the library modules they load (module-boundaries D8), and nothing else of the packages feed"

[[scenario]]
capability = "build/ci"
requirement = "Cache keyed on actual inputs"
scenario = "Toolchain inputs change"
by = "scripts/toolchain-key.sh; build.yml host-toolchain rebuilds on a key miss: cold in run 37143040755, from its own compiler cache in run 37166467868, whose toolchain-build.sh had changed (docs/ci.md)"

[[scenario]]
capability = "build/ci"
requirement = "Cache keyed on actual inputs"
scenario = "One compiler cache per stage"
by = "build.yml's caches job: after run 37143040755 the ref held one compiler cache for the host stage and one for each board, each trimmed to what its build used (WRT_COMPILER_CACHE_TRIM); later runs keep the newest of each (docs/ci.md, Cache usage)"

[[scenario]]
capability = "build/ci"
requirement = "Cache keyed on actual inputs"
scenario = "Rebuild from warm compiler caches"
by = "VM, 2026-10-04: the R4S built again from an empty build directory, every cache warm: sccache served all 404 Rust compiles, Go compiled no package anew, and ccache missed 2 of 15,264 calls, both of ncurses's lib_gen.c, which ncurses generates anew in every build, naming a temporary file after its PID. CI run 37181836494, from the caches run 37166467868 left with the same toolchain: ccache missed 6 and 3 of about 23,790 calls, sccache none, and Go compiled one package anew per board (docs/ci.md)"

[[scenario]]
capability = "build/ci"
requirement = "Build all kmods"
scenario = "Repository contains all kmods"
by = "build.yml firmware: ci profile with CONFIG_ALL_KMODS; artifact firmware-unsigned"

[[scenario]]
capability = "build/ci"
requirement = "Build stages need no secrets"
scenario = "CI runs in a fork"
by = "build.yml references no secret; a run in a fork without secrets (docs/ci.md)"

# build/environment: facts about the pinned environment and the local setup.

[[scenario]]
capability = "build/environment"
requirement = "Pinned common host environment"
scenario = "Local and CI tool versions match"
by = "just env-report in build.yml system-test compared with the local VM (docs/ci.md)"

[[scenario]]
capability = "build/environment"
requirement = "Pinned common host environment"
scenario = "Tool updates require a lock change"
by = "flake.lock pins nixpkgs and nixpkgs-unstable; env-report prints both revisions"

[[scenario]]
capability = "build/environment"
requirement = "Common build entry points"
scenario = "Full build in one command"
by = "just build <board> dev on the local VM; build.yml firmware"

[[scenario]]
capability = "build/environment"
requirement = "Configurable build directory outside the repository"
scenario = "Build directory on an external volume"
by = "local VM: WRT_WORKDIR on the SSD volume (docs/dev-setup.md), the compiler caches of every language in its compiler-cache/ (ccache, go-build, sccache); workdir_tree refuses paths inside the repository"

[[scenario]]
capability = "build/environment"
requirement = "Configurable build directory outside the repository"
scenario = "A new source tree"
by = "every CI job of build.yml: each starts from a fresh checkout, fetch and patch, restores its compiler cache into $WRT_WORKDIR/compiler-cache, and reports what each cache served"

[[scenario]]
capability = "build/environment"
requirement = "Rebuild only what changed"
scenario = "Build again without changes"
by = "local VM, 2026-10-04: just build r4s dev with nothing changed took 5 min 37 s; its time report held only the kernel's two forced passes, 2.5 s, which skip kbuild, and its compiler caches saw no compile (docs/dev-setup.md)"

[[scenario]]
capability = "build/environment"
requirement = "Rebuild only what changed"
scenario = "Change the compiler flags"
by = "local VM, 2026-10-04: dropping -fno-plt from config/toolchain.seed built the toolchains anew, recorded the flags without it, and prepared all 132 target packages of the R4S again; restoring it did the same (docs/patches.md, patch 0011)"

[[scenario]]
capability = "build/environment"
requirement = "Build time report"
scenario = "Find what holds up a build"
by = "scripts/build.sh and toolchain-build.sh end every build with the report (docs/ci.md, Build time), locally and in build.yml's host-toolchain and firmware jobs; the record stays in the tree's logs/"

# build/upstream-pinning: every fetch and patch run in CI re-proves these.

[[scenario]]
capability = "build/upstream-pinning"
requirement = "Upstream sources pinned to commits"
scenario = "Same lock yields same sources"
by = "scripts/fetch.sh dies unless every checkout is at its lock SHA; runs in both build.yml jobs"

[[scenario]]
capability = "build/upstream-pinning"
requirement = "Upstream sources pinned to commits"
scenario = "Feeds configuration pinned to commits"
by = "scripts/fetch.sh writes src-git <name> <url>^<sha> from upstream.lock"

[[scenario]]
capability = "build/upstream-pinning"
requirement = "Ordered patches, stop on failure"
scenario = "Patch conflict"
by = "scripts/patch.sh aborts git am and names the patch; build.yml stops at 'Fetch and patch sources'"

[[scenario]]
capability = "build/upstream-pinning"
requirement = "Ordered patches, stop on failure"
scenario = "All patches apply"
by = "manifest.json openwrt_head is identical across builds of the same lock and patches"

[[scenario]]
capability = "build/upstream-pinning"
requirement = "No remote scripts or in-place upstream edits"
scenario = "Audit build scripts"
by = "check.yml: just check (forbidden-patterns)"

[[scenario]]
capability = "build/upstream-pinning"
requirement = "Reproducible build timestamp"
scenario = "Same lock built at different times"
by = "scripts/fetch.sh writes version.date from upstream.lock; get_source_date_epoch.sh reads it first"

# firmware/toolchain: properties of the build, visible in its logs and outputs.

[[scenario]]
capability = "firmware/toolchain"
requirement = "Target toolchain version"
scenario = "Check toolchain version"
by = "build.yml firmware: staging_dir/toolchain-aarch64_generic_gcc-15.*_musl"

[[scenario]]
capability = "firmware/toolchain"
requirement = "LTO, mold, and gc-sections by default"
scenario = "Package incompatible with LTO"
by = "docs/optimization.md lists every no-lto opt-out with its patch in patches/packages"

# testing/harness: a property of CI.

[[scenario]]
capability = "testing/harness"
requirement = "Emulator run on every build"
scenario = "Test failure"
by = "build.yml system-test fails and publishes the JUnit report (task 11.6)"

# release/signing: GitHub's environment protection holds the sign job.

[[scenario]]
capability = "release/signing"
requirement = "Every signing requires manual approval"
scenario = "No approval"
by = "the release-signing environment's required reviewers; scripts/github-audit.sh reads them back (check.yml, weekly)"
